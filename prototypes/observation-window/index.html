<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Times Garden 観測窓</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one large observation window with four zoom levels as tabs above it; planet record and view controls in a strip below. Single deliberate dark world (night observatory), same tokens as the specimen room. */
:root{
  color-scheme:dark;
  --bg:#0a0d14;--panel:#111621;--line:#232b3b;--fg:#e4e8f0;--muted:#8c95a8;
  --accent:#e9b965;--accent-ink:#1a1308;--good:#8fd6a8;
  --font-display:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:14px;line-height:1.7}
.wrap{max-width:1180px;margin:0 auto;padding-block:26px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--font-display);font-size:clamp(26px,4vw,38px);line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:64ch}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{font:inherit;font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:center}
.tabs button .n{font-family:var(--font-mono);font-size:11px;opacity:.7}
.tabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.tabs button:focus-visible,.ctl button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#04060a;aspect-ratio:16/10;max-width:100%}
.stage canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;left:12px;top:10px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;font-family:var(--font-mono);font-size:11px;color:rgba(228,232,240,.8);letter-spacing:.05em}
.hud b{color:var(--fg);font-weight:500}
.badge{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(10,13,20,.72);border:1px solid rgba(233,185,101,.6);color:var(--accent);pointer-events:none;white-space:nowrap}
.hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:rgba(228,232,240,.6);pointer-events:none}
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
@media (max-width:860px){.below{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
.box h2{margin:0;font-size:11px;font-family:var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pname{font-family:var(--font-display);font-size:24px;font-weight:700;margin:0;line-height:1.25}
.seedrow{display:flex;gap:8px;flex-wrap:wrap}
.seedrow input{flex:1 1 200px;min-width:0;background:#0b0f18;border:1px solid var(--line);color:var(--fg);border-radius:4px;padding:7px 10px;font:inherit}
.ctl{display:flex;flex-wrap:wrap;gap:6px}
.ctl button{font:inherit;font-size:13px;border-radius:4px;padding:6px 12px;cursor:pointer;border:1px solid var(--line);background:#0b0f18;color:var(--fg)}
.ctl button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ctl button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 14px}
dt{color:var(--muted);font-size:12px;white-space:nowrap}
dd{margin:0;font-variant-numeric:tabular-nums;min-width:0}
.desc{margin:0;color:var(--fg)}
.sub{margin:0;color:var(--muted);font-size:12px}
.legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.legend i{flex:1;height:8px;border-radius:4px;display:block;max-width:220px}
.note{color:var(--muted);font-size:12px;margin:0;max-width:80ch}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Times Garden · 試作 02 · 見た目(第4版)</div>
    <h1>観測窓</h1>
    <p class="lead">号から生まれた架空の惑星を、宇宙から地表、そこに住む生き物の目まで寄って眺めます。見た目がどこまで届くかを確かめるための試作で、地表と生き物の目は 3D です。歴史の計算はまだ入っていません。</p>
  </header>

  <div class="tabs" role="tablist" aria-label="視点">
    <button role="tab" id="tab-system" aria-selected="true" data-view="system"><span class="n">1</span>恒星系</button>
    <button role="tab" id="tab-planet" aria-selected="false" data-view="planet"><span class="n">2</span>惑星</button>
    <button role="tab" id="tab-surface" aria-selected="false" data-view="surface"><span class="n">3</span>地表(神の視点)</button>
    <button role="tab" id="tab-creature" aria-selected="false" data-view="creature"><span class="n">4</span>生き物の目</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="観測窓"></canvas>
    <canvas id="cv3" aria-label="観測窓 3D" hidden></canvas>
    <div class="hud"><span id="hudL"></span><span id="hudR"></span></div>
    <div class="badge" id="badge" hidden></div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="below">
    <section class="box" aria-labelledby="recH">
      <h2 id="recH">惑星の記録</h2>
      <p class="pname" id="pname"></p>
      <div class="seedrow">
        <label for="seed" class="sub" style="align-self:center">号</label>
        <input type="text" id="seed" value="第241号 朝刊 2026-11-08" autocomplete="off">
        <div class="ctl"><button id="reroll">別の号</button></div>
      </div>
      <dl id="facts"></dl>
    </section>
    <section class="box" aria-labelledby="viewH">
      <h2 id="viewH">この視点</h2>
      <p class="desc" id="vdesc"></p>
      <div class="ctl" id="vctl"></div>
      <div class="legend" id="legend" hidden><span id="legLo"></span><i id="legBar"></i><span id="legHi"></span></div>
      <p class="sub" id="vsub"></p>
    </section>
  </div>
  <p class="note">試作です。惑星と生き物の見た目は号の文字列から決まります。本番では、地形や生き物の分布は生態系の計算結果から作ります。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- seeded randomness ---------- */
function cyrb128(str){let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;for(let i=0,k;i<str.length;i++){k=str.charCodeAt(i);h1=h2^Math.imul(h1^k,597399067);h2=h3^Math.imul(h2^k,2869860233);h3=h4^Math.imul(h3^k,951274213);h4=h1^Math.imul(h4^k,2716044179);}h1=Math.imul(h3^(h1>>>18),597399067);h2=Math.imul(h4^(h2>>>22),2869860233);h3=Math.imul(h1^(h3>>>17),951274213);h4=Math.imul(h2^(h4>>>19),2716044179);h1^=(h2^h3^h4);h2^=h1;h3^=h1;h4^=h1;return[h1>>>0,h2>>>0,h3>>>0,h4>>>0];}
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21|c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return(t>>>0)/4294967296;};}
function RNG(s){const f=sfc32(...cyrb128(s));for(let i=0;i<15;i++)f();return{f,range:(a,b)=>a+(b-a)*f(),int:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:a=>a[Math.floor(f()*a.length)],chance:p=>f()<p,weighted:o=>{const k=Object.keys(o);let t=0;k.forEach(x=>t+=o[x]);let r=f()*t;for(const x of k){r-=o[x];if(r<=0)return x;}return k[k.length-1];}};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------- value noise ---------- */
function h2(i,j,s){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(s,1274126177);h=Math.imul(h^(h>>>13),1103515245);h^=h>>>16;return(h>>>0)/4294967296;}
function h3(i,j,k,s){let h=Math.imul(i,374761393)^Math.imul(j,668265263)^Math.imul(k,1440662683)^Math.imul(s,1274126177);h=Math.imul(h^(h>>>13),1103515245);h^=h>>>16;return(h>>>0)/4294967296;}
function n2(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(h2(xi,yi,s),h2(xi+1,yi,s),u),lerp(h2(xi,yi+1,s),h2(xi+1,yi+1,s),u),v);}
function n3(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=lerp(lerp(h3(xi,yi,zi,s),h3(xi+1,yi,zi,s),u),lerp(h3(xi,yi+1,zi,s),h3(xi+1,yi+1,zi,s),u),v);
  const b=lerp(lerp(h3(xi,yi,zi+1,s),h3(xi+1,yi,zi+1,s),u),lerp(h3(xi,yi+1,zi+1,s),h3(xi+1,yi+1,zi+1,s),u),v);return lerp(a,b,w);}
function f3(x,y,z,s,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*n3(x*f,y*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03;}return t/n;}
function f2(x,y,s,o){let a=.5,f=1,t=0,n=0;for(let i=0;i<o;i++){t+=a*n2(x*f,y*f,s+i*17);n+=a;a*=.5;f*=2.03;}return t/n;}
function f1(x,s,o){return f2(x,.37,s,o);}

/* ---------- color ---------- */
function hx(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixc(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function css(c,a){return a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}

const STAR={
  red:{name:'赤色矮星',core:'#ffcf9e',glow:'#ff5a36',light:'#ffb48c',sky0:'#3a1418',sky1:'#120609',veg:'#4a2347',veg2:'#7a2f4e',dry:'#7a5444',rock:'#5a4a4c',oceanS:'#4a3f6a',oceanD:'#1a1530',atm:'#ff8f72',plant:'#ff6a80',ground:'#2c1620',hill:'#4a2232',far:'#5a2a34',nv:[255,170,110]},
  yellow:{name:'黄色い恒星',core:'#fff6dc',glow:'#ffc85a',light:'#fff2dc',sky0:'#6fa2d6',sky1:'#cfe2ef',veg:'#4f7d3a',veg2:'#7d9a45',dry:'#b89a62',rock:'#7d7468',oceanS:'#3e8fb0',oceanD:'#123a63',atm:'#86b8ff',plant:'#e8d26a',ground:'#3d4a2a',hill:'#55704a',far:'#7f97a8',nv:[170,255,160]},
  blue:{name:'青白い恒星',core:'#ffffff',glow:'#9fd2ff',light:'#e6f0ff',sky0:'#2a4f8f',sky1:'#a9c7ee',veg:'#2f8a86',veg2:'#5fb0c0',dry:'#9aa6b8',rock:'#6c7690',oceanS:'#5fb6d8',oceanD:'#13305a',atm:'#bfe4ff',plant:'#bff0ff',ground:'#22364a',hill:'#355a70',far:'#6d8fb3',nv:[150,230,255]}
};
const SY=[["ラ","ra"],["ク","ku"],["シ","shi"],["オ","o"],["メ","me"],["ト","to"],["レ","re"],["ノ","no"],["ヴィ","vi"],["ル","ru"],["カ","ka"],["セ","se"],["ミ","mi"],["ド","do"],["フィ","fi"],["ロ","ro"],["テ","te"],["ナ","na"],["ゼ","ze"],["ム","mu"],["ソ","so"],["キ","ki"],["ハ","ha"],["リ","ri"],["ユ","yu"],["ニ","ni"],["タ","ta"]];

/* ---------- planet generation ---------- */
const TW=384,TH=192;
function genPlanet(seed){
  const R=RNG('planet|'+seed);
  const star=R.weighted({red:.35,yellow:.45,blue:.2});const S=STAR[star];
  let name='';const n=R.int(2,3);for(let i=0;i<n;i++)name+=R.pick(SY)[0];name+=R.pick(['ア','イス','オン','ネ','ラ']);
  const P={seed,star,S,name:name,
    seaFrac:R.range(.3,.72),temp:star==='red'?R.range(-8,22):star==='yellow'?R.range(4,28):R.range(10,38),
    cloudTh:R.range(.5,.62),o2:R.range(2,34),moons:R.int(0,3),moonRatio:R.range(.55,1.45),
    s:R.int(1,1e6),rot:R.range(0,6.28),orbit:R.int(2,4),nPlanets:R.int(5,7),life:R.weighted({micro:1,complex:3,lush:1.5})};
  if(R.chance(.18)){P.moonRatio=R.range(.975,1.025);}
  if(Math.abs(P.moonRatio-1)<.04&&P.moons===0)P.moons=1;
  P.perfect=P.moons>0&&Math.abs(P.moonRatio-1)<.04;
  P.polar=clamp(1.3-P.temp/55,.75,1.35);
  P.others=[];for(let i=0;i<P.nPlanets;i++){P.others.push({r:R.range(.35,1.6)*(i>3?1.8:1),col:R.pick(['#c9a27a','#8fa8c8','#d6c3a0','#a07a6a','#7fb0a0','#c8b8e0','#e0c090']),ph:R.range(0,6.28),ring:i>3&&R.chance(.4)});}
  buildTexture(P);
  return P;
}
function buildTexture(P){
  const S=P.S,N=TW*TH,h=new Float32Array(N),m=new Float32Array(N),cl=new Uint8Array(N);
  const s=P.s;let mn=1,mx=0;
  for(let v=0;v<TH;v++){const lat=Math.PI/2-(v+.5)/TH*Math.PI,cl0=Math.cos(lat),y=Math.sin(lat);
    for(let u=0;u<TW;u++){const lon=(u+.5)/TW*Math.PI*2-Math.PI,x=cl0*Math.sin(lon),z=cl0*Math.cos(lon),i=v*TW+u;
      const e=f3(x*1.7+3.1,y*1.7,z*1.7,s,5);h[i]=e;if(e<mn)mn=e;if(e>mx)mx=e;
      m[i]=f3(x*2.2,y*2.2+9,z*2.2,s+101,3);
      const c=f3(x*2.6+5,y*3.4,z*2.6,s+303,5);cl[i]=Math.round(smooth(P.cloudTh,P.cloudTh+.16,c)*235);}}
  const sorted=Array.from(h).sort((a,b)=>a-b);const sea=sorted[Math.floor(P.seaFrac*(N-1))];
  P.sea=sea;P.hmin=mn;P.hmax=mx;
  const col=new Uint8ClampedArray(N*3),oce=new Uint8Array(N);
  const oS=hx(S.oceanS),oD=hx(S.oceanD),veg=hx(S.veg),veg2=hx(S.veg2),dry=hx(S.dry),rock=hx(S.rock),snow=[236,242,248],sand=mixc(dry,[240,226,190],.4);
  for(let v=0;v<TH;v++){const lat=Math.abs(Math.PI/2-(v+.5)/TH*Math.PI);
    for(let u=0;u<TW;u++){const i=v*TW+u,e=h[i];let c;
      if(e<sea){const d=Math.sqrt((sea-e)/(sea-mn));c=mixc(oS,oD,d);oce[i]=1;if(lat>P.polar+.12)c=mixc(c,snow,.85);}
      else{const a=(e-sea)/(mx-sea);c=a<.035?sand:mixc(dry,mixc(veg,veg2,m[i]*1.4-.3<0?0:Math.min(1,m[i]*1.4-.3)),smooth(.35,.6,m[i]));
        if(a>.45)c=mixc(c,rock,smooth(.45,.7,a));if(a>.8||lat>P.polar)c=mixc(c,snow,lat>P.polar?.9:smooth(.8,.95,a));}
      col[i*3]=c[0];col[i*3+1]=c[1];col[i*3+2]=c[2];}}
  P.h=h;P.col=col;P.cl=cl;P.oce=oce;P.moist=m;
}

/* ---------- canvas setup ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1;
function resize(){const r=cv.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,Math.round(r.width*DPR));H=Math.max(1,Math.round(r.height*DPR));cv.width=W;cv.height=H;}
const bgStars=(()=>{const R=RNG('stars');const a=[];for(let i=0;i<260;i++)a.push({x:R.f(),y:R.f(),r:R.range(.3,1.4),t:R.range(0,6)});return a;})();
function drawStars(c,w,h,t,alpha){for(const s of bgStars){const a=(.35+.35*Math.sin(t*1.1+s.t))*alpha;c.fillStyle=`rgba(255,255,255,${a})`;c.fillRect(s.x*w,s.y*h,s.r*DPR,s.r*DPR);}}
function glow(c,x,y,r,col,a){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,css(col,a));g.addColorStop(1,css(col,0));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();}

/* ---------- view 1: star system ---------- */
function drawSystem(c,t){
  const P=planet,S=P.S;c.fillStyle='#04060a';c.fillRect(0,0,W,H);drawStars(c,W,H,t,1);
  const cx=W/2,cy=H*.52,base=Math.min(W,H);
  glow(c,cx,cy,base*.32,hx(S.glow),.35);glow(c,cx,cy,base*.12,hx(S.glow),.8);
  c.fillStyle=S.core;c.beginPath();c.arc(cx,cy,base*(P.star==='red'?.05:P.star==='blue'?.028:.04),0,7);c.fill();
  const items=[];
  P.others.forEach((o,i)=>{const rr=base*(.12+i*.075),sp=.35/Math.pow(i+1,1.5),a=o.ph+t*sp;
    c.strokeStyle=i===P.orbit?'rgba(233,185,101,.55)':'rgba(180,190,220,.13)';c.lineWidth=(i===P.orbit?1.4:1)*DPR;c.beginPath();c.ellipse(cx,cy,rr*1.55,rr*.5,0,0,7);c.stroke();
    items.push({x:cx+Math.cos(a)*rr*1.55,y:cy+Math.sin(a)*rr*.5,z:Math.sin(a),r:base*.011*o.r*(i===P.orbit?1.25:1),o,i});});
  items.sort((a,b)=>a.z-b.z).forEach(p=>{
    const col=p.i===P.orbit?hx(S.oceanS):hx(p.o.col);
    if(p.o.ring){c.strokeStyle='rgba(220,210,190,.45)';c.lineWidth=1.2*DPR;c.beginPath();c.ellipse(p.x,p.y,p.r*2.2,p.r*.7,-.2,0,7);c.stroke();}
    const dx=cx-p.x,dy=cy-p.y,d=Math.hypot(dx,dy)||1;
    const g=c.createRadialGradient(p.x+dx/d*p.r*.5,p.y+dy/d*p.r*.5,p.r*.1,p.x,p.y,p.r*1.05);g.addColorStop(0,css(mixc(col,[255,255,255],.25)));g.addColorStop(.6,css(col));g.addColorStop(1,css(mixc(col,[0,0,0],.75)));
    c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();
    if(p.i===P.orbit){c.strokeStyle='rgba(233,185,101,.9)';c.lineWidth=1*DPR;c.beginPath();c.arc(p.x,p.y,p.r+6*DPR,0,7);c.stroke();
      c.fillStyle='rgba(233,185,101,.95)';c.font=`${12*DPR}px "IBM Plex Mono",monospace`;c.fillText(P.name,p.x+p.r+10*DPR,p.y-6*DPR);hit.planet={x:p.x,y:p.y,r:p.r+14*DPR};}
  });
}

/* ---------- view 2: planet ---------- */

const VIEWS={
  system:{desc:'号から生まれた恒星系を外から見ています。金色の軌道が、この号の惑星です。',hint:'惑星をクリックすると近づきます'},
  planet:{desc:'惑星を宇宙から見ています。恒星の種類で、光の色、植物の色、大気の縁の色が変わります。',hint:'惑星をクリックすると地表へ'},
  surface:{desc:'地表を斜め上から見る神の視点です。光と影のある 3D の地形に、データを重ねて切り替えられます。光る点は生き物の群れです。',hint:'ドラッグで回転、ホイールで拡大'},
  creature:{desc:'',hint:''}
};
const EYES={normal:{label:'ふつうの目',desc:'この惑星の生き物の目の高さで、地表を歩いています。草や植物は風に揺れ、この惑星の生き物(3D 標本室と同じ作り方)が並んで歩いています。月が恒星の前を通ると日食が起きます。'},
  night:{label:'暗視の目',desc:'夜の地表を、弱い光を増幅する大きな目で見ています。光る植物が目印になります。色はこの恒星の光の色に寄っています。'},
  blind:{label:'目のない種',desc:'赤外線を左右に振って周りを探っています。当たった所に点が残り、ゆっくり消えていきます。点は地形や植物の上に固定されているので、歩くと景色の中を進んでいく感覚になります。数秒ごとに音を出し、広がる波紋でほかの生き物(桃色)の輪郭が一瞬浮かびます。'},
  compound:{label:'複眼',desc:'12の小さな目が、少しずつ違う方向と色味で世界をとらえています。世界は1回だけ描き、その画像を目ごとに切り出しているので、目が増えても重くなりません。'}};
function is3D(v){return v==='surface'||v==='creature';}
function setView(v){const was=state.view;state.view=v;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v?'true':'false'));
  if(!is3D(v)&&!is3D(was))trans={from:was,t:0};else trans=null;
  document.getElementById('cv3').hidden=!(is3D(v)&&HAS3D);document.getElementById('cv').hidden=is3D(v)&&HAS3D;
  if(is3D(v)&&HAS3D){if(!R3)init3D();resize3D();if(R3.worldSeed!==planet.seed)buildWorld(planet);}
  if(v==='creature')clearLidar();updatePanel();}
let trans=null;
function updatePanel(){
  const v=state.view;const vd=document.getElementById('vdesc'),vc=document.getElementById('vctl'),vs=document.getElementById('vsub'),lg=document.getElementById('legend');
  vc.textContent='';vs.textContent='';lg.hidden=true;
  document.getElementById('hint').textContent=VIEWS[v].hint;
  if(v==='surface'){vd.textContent=VIEWS.surface.desc;Object.entries(OVER).forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;b.id='ov-'+k;if(k===overlay)b.className='on';b.addEventListener('click',()=>{overlay=k;updatePanel();});vc.appendChild(b);});
    if(overlay!=='terrain'){lg.hidden=false;const kind=overlay==='life'?'life':overlay;const stops=[0,.33,.66,1].map(x=>css(seqColor(x,kind))).join(',');document.getElementById('legBar').style.background=`linear-gradient(90deg,${stops})`;
      document.getElementById('legLo').textContent=overlay==='temp'?'-20℃':'少ない';document.getElementById('legHi').textContent=overlay==='temp'?'45℃':'多い';}
    vs.textContent='数値はまだ仮のものです。本番では生態系の計算結果を重ねます。';}
  else if(v==='creature'){vd.textContent=EYES[eye].desc;Object.entries(EYES).forEach(([k,e])=>{const b=document.createElement('button');b.textContent=e.label;b.id='eye-'+k;if(k===eye)b.className='on';b.addEventListener('click',()=>{eye=k;clearLidar();updatePanel();});vc.appendChild(b);});
    vs.textContent='同じ時刻・同じ場所でも、どの体で見るかで世界が変わります。神の視点と同じ地形の上を歩いています。';}
  else{vd.textContent=VIEWS[v].desc;const b=document.createElement('button');b.className='primary';b.textContent=v==='system'?'この惑星に近づく':'地表へ降りる';b.addEventListener('click',()=>setView(v==='system'?'planet':'surface'));vc.appendChild(b);}
  if(is3D(v)&&!HAS3D)vs.textContent='3D の部品を読み込めなかったため、この視点は表示できません。';
}
function updateRecord(){
  const P=planet;document.getElementById('pname').textContent=`惑星 ${P.name}`;
  const facts=[['恒星',P.S.name],['海の割合',Math.round(P.seaFrac*100)+'%'],['平均気温',P.temp.toFixed(0)+'℃'],['大気の酸素',P.o2.toFixed(0)+'%'],['衛星',P.moons?P.moons+'個':'なし'],
    ['月と恒星の見かけ',P.moons?`${P.moonRatio.toFixed(2)} 倍${P.perfect?'(皆既日食が起きる)':''}`:'衛星なし'],['生命',{micro:'微生物の段階',complex:'複雑な生き物が出現',lush:'多様な生き物で満ちている'}[P.life]]];
  const dl=document.getElementById('facts');dl.textContent='';facts.forEach(([k,v])=>{const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd);});
}
function load(seed){planet=genPlanet(seed);updateRecord();if(R3&&is3D(state.view))buildWorld(planet);updatePanel();}

document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*DPR,y=(e.clientY-r.top)*DPR;const p=hit.planet;if(!p)return;if(Math.hypot(x-p.x,y-p.y)<p.r){if(state.view==='system')setView('planet');else if(state.view==='planet')setView('surface');}});
document.getElementById('seed').addEventListener('change',e=>load(e.target.value));
document.getElementById('reroll').addEventListener('click',()=>{const n=200+Math.floor(Math.random()*400);const s=`第${n}号 ${Math.random()<.5?'朝刊':'昼刊'}`;document.getElementById('seed').value=s;load(s);});
window.addEventListener('keydown',e=>{const m={'1':'system','2':'planet','3':'surface','4':'creature'}[e.key];if(m&&document.activeElement.tagName!=='INPUT')setView(m);});

const drawers={system:drawSystem,planet:drawPlanet};
let last=performance.now(),T=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(!reduce)T+=dt;
  if(is3D(state.view)&&HAS3D&&R3&&R3.world){render3D(dt);}
  else if(!is3D(state.view)){ctx.setTransform(1,0,0,1,0,0);hit={};
    if(trans&&trans.t<1&&!reduce){trans.t+=dt/0.9;const k=smooth(0,1,trans.t);
      ctx.save();drawers[trans.from](ctx,T,dt);ctx.restore();
      ctx.save();ctx.globalAlpha=k;ctx.translate(W/2,H/2);const s=.35+.65*k;ctx.scale(s,s);ctx.translate(-W/2,-H/2);drawers[state.view](ctx,T,dt);ctx.restore();
      ctx.fillStyle=`rgba(4,6,10,${.6*(1-Math.abs(k*2-1))})`;ctx.fillRect(0,0,W,H);}
    else drawers[state.view](ctx,T,dt);}
  const P=planet;const hl=document.getElementById('hudL'),hr=document.getElementById('hudR'),bd=document.getElementById('badge');
  hl.textContent='';const b=document.createElement('b');b.textContent={system:'恒星系',planet:'惑星',surface:'地表',creature:'生き物の目'}[state.view];hl.append(b,` ${P.name}`);
  hr.textContent=state.view==='creature'?EYES[eye].label:state.view==='surface'?OVER[overlay]:P.S.name;
  if(state.view==='creature'&&eye==='normal'&&state.eclipse>.15){bd.hidden=false;bd.textContent=P.perfect&&state.eclipse>.95?'皆既日食。月と恒星の見かけの大きさがほぼ同じ':'日食が進んでいます';}else bd.hidden=true;
  requestAnimationFrame(frame);
}
if(window.ResizeObserver){new ResizeObserver(()=>{resize();resize3D();}).observe(document.getElementById('stage'));}
resize();load(document.getElementById('seed').value);requestAnimationFrame(frame);
})();
</script>
